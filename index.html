<!DOCTYPE html>
<!--Created by Damian Sclafani-->
<html lang="en">
    <head>
        <title>Game Night Emporium</title>
        <link rel="styles" href="styles.css">
    </head>
    <body>

        <style>
            body {
                background:mediumseagreen;
                font-family:Arial, Helvetica, sans-serif;
            }

            .flex-container {
                display: flex;
                align-items: center;
                gap: 20px;
            }

            .topnav {
                background-color: #333;
                overflow: hidden;
                position: fixed;
                top: 0;
                width: 100%;
            }
  
            /* Style the links inside the navigation bar */
            .topnav a {
                float: left;
                color: #f2f2f2;
                text-align: center;
                padding: 14px 16px;
                text-decoration: none;
                font-size: 17px;
            }
  
            /* Change the color of links on hover */
            .topnav a:hover {
            background-color: #ddd;
            color: black;
            }
  
            /* Add a color to the active/current link */
            .topnav a.active {
                background-color: #038052;
                color: white;
            }

            /* Center Image */
            .center {
                display: block;
                margin-left: auto;
                margin-right: auto;
                width: 50%;
            }
        </style>

        <div class="topnav">
            <a class="active" href="index.html">Home</a>
          </div>

        <div class="assignments">

            <div class="flex-container">
                <p>
                    Welcome to Game Night Emporium! Lots of Tabletop experiences can be found here! 
                    Dungeons & Dragons, Magic the Gathering, Warhammer, and even Pathfinder. 
                    Our locations sell various products for all of these games. 
                    Our staff lets you book events as well!
                </p>
            </div>
        <div>
    </body>
</html>
