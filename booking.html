<!DOCTYPE html>

<html lang="en">
    <head>
        <title>Game Night Emporium - Booking</title>
        <link rel="styles" href="styles.css">
    </head>
    <body>

        <style>
            body {
                background:mediumseagreen;
                font-family:Arial, Helvetica, sans-serif;
            }

            .assignments {
                display:flex;
                flex-wrap:wrap;
                font-size:21px;
                padding-top:50px;
            }

            .assignment {
                width:22%;
                padding:10px;
                margin:10px;
                padding:20px 10px;
                background:seagreen;
                border-radius:10px;
            }

            .flex-container {
                display: flex;
                align-items: center;
                gap: 20px;
            }

            .topnav {
                background-color: #333;
                overflow: hidden;
                position: fixed;
                top: 0;
                width: 100%;
            }
  
            /* Style the links inside the navigation bar */
            .topnav a {
                float: left;
                color: #f2f2f2;
                text-align: center;
                padding: 14px 16px;
                text-decoration: none;
                font-size: 17px;
            }
  
            /* Change the color of links on hover */
            .topnav a:hover {
            background-color: #ddd;
            color: black;
            }
  
            /* Add a color to the active/current link */
            .topnav a.active {
                background-color: #038052;
                color: white;
            }

            /* Center Image */
            .center {
                display: block;
                margin-left: auto;
                margin-right: auto;
                width: 50%;
            }
        </style>

        <div class="topnav">
            <a href="index.html">Home</a>
            <a herf="store.html">Store</a>
            <a class="active" herf="booking.html">Booking</a>

          </div>

                </p>
            </div>
